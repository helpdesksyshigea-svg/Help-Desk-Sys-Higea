# Blueprint de Render: crea la API y el sitio web en un solo paso.
# Render > New > Blueprint > elegir este repositorio.
# Las variables marcadas con "sync: false" las pide Render al crear el
# Blueprint (son secretas o dependen de la URL final; nunca van en el repo).

services:
  # ---------- Backend (Express) ----------
  - type: web
    name: helpdesk-higea-api
    runtime: node
    rootDir: api
    plan: free
    region: virginia # mismo lugar que el proyecto Supabase (us-east-1)
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: WEB_ORIGIN # URL del sitio web, ej. https://helpdesk-higea-web.onrender.com (sin "/" final)
        sync: false
      - key: CRON_SECRET
        generateValue: true
      # Correo opción 1: SMTP (Gmail con contraseña de aplicación). Tiene prioridad.
      # Ojo: el plan gratuito de Render bloquea los puertos SMTP salientes;
      # para usarlo el servicio debe estar en un plan pago (Starter).
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      # Correo opción 2: Resend (sin dominio verificado solo entrega al dueño de la cuenta)
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false

  # ---------- Frontend (React + Vite, sitio estático) ----------
  - type: web
    name: helpdesk-higea-web
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      # SPA: cualquier ruta (ej. /tickets/123) devuelve index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_API_URL # URL de la API, ej. https://helpdesk-higea-api.onrender.com (sin "/" final)
        sync: false
